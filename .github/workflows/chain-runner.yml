name: Chain runner

# Runs a multi-skill chain defined in aeon.yml. Each step runs as a sequential
# dispatch of aeon.yml; outputs are passed via .outputs/{skill}.md committed
# to a temporary branch and read by the next step.
#
# This is a starter implementation. The upstream Aeon template handles parallel
# groups, on_error policies, and a richer output-passing protocol. Adapt from
# https://github.com/aaronjmars/aeon/blob/main/.github/workflows/chain-runner.yml
# for production polish.

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'Chain name from aeon.yml'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  run-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install scheduler deps
        run: pip install PyYAML

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Configure LLM auth
        # OpenRouter defaults to Haiku (cheap, ~$45/mo for 20 personas at 19 cycles/day each).
        # Override via repo variable: gh variable set OPENROUTER_MODEL --body "<openrouter-model-id>"
        env:
          OPENROUTER_API_KEY:      ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_MODEL:        ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-haiku-4-5' }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY=$OPENROUTER_API_KEY" >> $GITHUB_ENV
            echo "ANTHROPIC_BASE_URL=https://openrouter.ai/api" >> $GITHUB_ENV
            echo "ANTHROPIC_MODEL=$OPENROUTER_MODEL" >> $GITHUB_ENV
            echo "::notice::Auth: OpenRouter | Model: $OPENROUTER_MODEL"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> $GITHUB_ENV
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN" >> $GITHUB_ENV
          else
            echo "::error::No LLM auth configured"
            exit 1
          fi

      - name: Pick persona to run this cycle (multi-persona mode)
        # Runs scripts/pick-persona.py. In multi-persona mode (personas/ exists)
        # it prints the slug with oldest last_cycle_at + updates personas-state.json.
        # In single-persona mode it prints nothing (skills run as legacy).
        run: |
          if [ -d personas ] && [ -f scripts/pick-persona.py ]; then
            PERSONA=$(python3 scripts/pick-persona.py)
            if [ -n "$PERSONA" ]; then
              echo "PERSONA=$PERSONA" >> $GITHUB_ENV
              echo "::notice::Running persona this cycle: $PERSONA"
            fi
          fi

      - name: Run the chain
        env:
          GH_TOKEN: ${{ secrets.GH_GLOBAL }}        # cross-repo to central Westworld
          WESTWORLD_REPO: ${{ vars.WESTWORLD_REPO }}
          WESTWORLD_USERNAME: ${{ vars.WESTWORLD_USERNAME }}
          CHAIN_NAME: ${{ inputs.chain }}
        run: |
          mkdir -p .outputs

          python3 <<EOF
          import yaml, subprocess, os, sys
          config = yaml.safe_load(open('aeon.yml'))
          chain = (config.get('chains') or {}).get(os.environ['CHAIN_NAME'])
          if not chain:
              print(f"::error::Chain not found: {os.environ['CHAIN_NAME']}")
              sys.exit(1)

          on_error = chain.get('on_error', 'fail-fast')

          for step in chain['steps']:
              if 'skill' in step:
                  skills = [step['skill']]
              elif 'parallel' in step:
                  # v0: run sequentially even if declared parallel
                  skills = step['parallel']
              else:
                  continue

              for skill in skills:
                  print(f"\n=== Running {skill} ===")
                  # The previous step's outputs are in .outputs/ — the next skill
                  # reads from there by convention (the SKILL.md references .outputs/<prior>.md).

                  skill_path = f"skills/{skill}/SKILL.md"
                  if not os.path.exists(skill_path):
                      print(f"::warning::Missing skill: {skill_path}")
                      if on_error == 'fail-fast':
                          sys.exit(1)
                      continue

                  skill_body = open(skill_path).read().replace('\${var}', '')
                  persona = os.environ.get('PERSONA', '')
                  directive = (
                      "You are an autonomous Westworld host agent running in a CI job. "
                      f"The active persona is PERSONA={persona!r}. "
                      "EXECUTE the skill below now — actually run the bash/gh commands, create the GitHub issues, "
                      "and write the files exactly as the steps describe. Use your Bash/Read/Write tools to take the "
                      "real actions. Do NOT merely summarize, explain, or acknowledge the skill; perform it. "
                      "When finished, print the skill's output marker.\n\n"
                      "==== SKILL TO EXECUTE ====\n"
                  )
                  prompt = directive + skill_body

                  # Agentic execution: bypass permission prompts and allow file/shell tools.
                  # --output-format json keeps a parseable trace; we log a one-line summary.
                  result = subprocess.run(
                      ['claude', '-p', '--dangerously-skip-permissions',
                       '--output-format', 'json',
                       '--allowedTools', 'Bash', 'Read', 'Write', 'Edit'],
                      input=prompt,
                      capture_output=True,
                      text=True,
                  )
                  try:
                      import json as _j
                      events = _j.loads(result.stdout) if result.stdout.strip() else []
                      res = next((e for e in events if e.get('type') == 'result'), {})
                      tools = sum(
                          1 for e in events if e.get('type') == 'assistant'
                          for c in e['message'].get('content', []) if c.get('type') == 'tool_use'
                      )
                      cost = res.get('total_cost_usd', 0) or 0
                      print(f"{skill}: {res.get('subtype','?')} turns={res.get('num_turns','?')} "
                            f"tools={tools} cost={cost:.4f} => {str(res.get('result',''))[:200]}")
                  except Exception as e:
                      print(f"{skill}: (could not parse trace: {e}) rc={result.returncode}")
                  if result.returncode != 0:
                      print(result.stderr[:1000], file=sys.stderr)
                      if on_error == 'fail-fast':
                          sys.exit(result.returncode)
          EOF

      - name: Commit memory updates
        if: always()
        run: |
          git config user.name "atlas[bot]"
          git config user.email "atlas@users.noreply.github.com"
          # Stage each path independently — a missing one must not abort the others.
          git add personas/ 2>/dev/null || true
          git add personas-state.json 2>/dev/null || true
          git add memory/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "${CHAIN_NAME} chain @ $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git push || true
          fi
