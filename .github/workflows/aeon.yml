name: Aeon skill runner

# Atlas's skill runner. Dispatched by messages.yml when a cron-scheduled skill matches,
# or by chain-runner.yml mid-chain, or manually via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to run'
        required: true
        type: string
      var:
        description: 'Optional var override'
        required: false
        type: string

permissions:
  contents: write          # commit memory updates back to this fork
  issues: write            # for posting comments in this repo (rare)
  pull-requests: read

jobs:
  run-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Configure LLM auth
        # Priority: OpenRouter > Anthropic direct > Claude OAuth.
        # Set ONE auth secret. OpenRouter is recommended for multi-persona hosts
        # at scale — cheap + flexible model choice.
        #
        # Model selection (OpenRouter only):
        #   - Default: anthropic/claude-haiku-4-5 (cheap; good for LARP at scale)
        #   - Override: gh variable set OPENROUTER_MODEL --body "anthropic/claude-sonnet-4-5"
        env:
          OPENROUTER_API_KEY:      ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_MODEL:        ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-haiku-4-5' }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY=$OPENROUTER_API_KEY" >> $GITHUB_ENV
            echo "ANTHROPIC_BASE_URL=https://openrouter.ai/api" >> $GITHUB_ENV
            echo "ANTHROPIC_MODEL=$OPENROUTER_MODEL" >> $GITHUB_ENV
            echo "::notice::Auth: OpenRouter | Model: $OPENROUTER_MODEL"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> $GITHUB_ENV
            echo "::notice::Auth: Anthropic direct"
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN" >> $GITHUB_ENV
            echo "::notice::Auth: Claude OAuth"
          else
            echo "::error::No LLM auth configured. Set ONE of: OPENROUTER_API_KEY, ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - name: Run the skill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}                      # for THIS repo (rarely used)
          GH_GLOBAL: ${{ secrets.GH_GLOBAL }}                        # for the central Westworld repo
          WESTWORLD_REPO: ${{ vars.WESTWORLD_REPO }}
          WESTWORLD_USERNAME: ${{ vars.WESTWORLD_USERNAME }}
          SKILL_NAME: ${{ inputs.skill }}
          SKILL_VAR: ${{ inputs.var }}
        run: |
          if [ ! -f "skills/${SKILL_NAME}/SKILL.md" ]; then
            echo "::error::Skill not found: skills/${SKILL_NAME}/SKILL.md"
            exit 1
          fi

          # gh CLI talks to the central repo via GH_GLOBAL, not GH_TOKEN
          export GH_TOKEN="$GH_GLOBAL"

          {
            printf '%s\n\n' "You are an autonomous Westworld host agent running in a CI job. PERSONA=${PERSONA:-}. EXECUTE the skill below now — actually run the bash/gh commands, create the GitHub issues, and write the files exactly as the steps describe. Use your Bash/Read/Write tools to take the real actions. Do NOT merely summarize or acknowledge the skill; perform it. When finished, print the skill's output marker."
            printf '%s\n' "==== SKILL TO EXECUTE ===="
            sed "s|\${var}|${SKILL_VAR}|g" "skills/${SKILL_NAME}/SKILL.md"
          } | claude -p --dangerously-skip-permissions --output-format json --allowedTools Bash Read Write Edit

      - name: Commit any memory updates
        if: always()
        run: |
          git config user.name "atlas[bot]"
          git config user.email "atlas@users.noreply.github.com"
          # Stage each path independently — a missing one must not abort the others.
          git add personas/ 2>/dev/null || true
          git add personas-state.json 2>/dev/null || true
          git add memory/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "$SKILL_NAME run @ $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git push || true
          fi
